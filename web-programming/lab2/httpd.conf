ServerAdmin evorovarvara7@gmail.com


ServerName helios.cs.ifmo.ru:29731


<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "/var/www"
<Directory "/var/www">

    Options FollowSymLinks

    AllowOverride None

    Require all granted
</Directory>


<IfModule dir_module>
    DirectoryIndex server.jar main_page.html
</IfModule>


<Files ".ht*">
    Require all denied
</Files>


ErrorLog "/home/studs/s408575/httpd-root/error.log"
PidFile "/home/studs/s408575/httpd-root/httpd.pid"


LogLevel warn

<IfModule log_config_module>

    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common

    <IfModule logio_module>
      LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>


    CustomLog "/home/studs/s408575/httpd-root/access.log" combined

</IfModule>

<IfModule alias_module>

    ScriptAlias /cgi-bin/ "/usr/local/www/apache24/cgi-bin/"

</IfModule>

<IfModule cgid_module>

</IfModule>


<Directory "/usr/local/www/apache24/cgi-bin">
    AllowOverride None
    Options None
    Require all granted
</Directory>

<IfModule headers_module>

    RequestHeader unset Proxy early
</IfModule>

<IfModule mime_module>

    TypesConfig etc/apache24/mime.types

    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz

</IfModule>

<IfModule proxy_html_module>
Include etc/apache24/extra/proxy-html.conf
</IfModule>


<IfModule ssl_module>
SSLRandomSeed startup builtin
SSLRandomSeed connect builtin
</IfModule>

AcceptFilter http none
AcceptFilter https none


<VirtualHost *:29731>
    ServerName localhost
    DocumentRoot /home/studs/s408575/httpd-root/
    Alias /index "/home/studs/s408575/httpd-root/"  
    <Directory "/home/studs/s408575/httpd-root/">  
        Options +Indexes  
        AllowOverride None  
        Require all granted
    </Directory>

    ScriptAlias /fcgi-bin/ /home/studs/s408575/httpd-root/fcgi-bin/
    
    <Location "/fcgi-bin/">
        SetHandler fastcgi-script
        Options +ExecCGI
        Require all granted
    </Location>

    FastCgiExternalServer /home/studs/s408575/httpd-root/fcgi-bin/server.jar -host localhost:29732
</VirtualHost>
